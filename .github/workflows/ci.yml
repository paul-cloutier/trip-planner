# Generated by kei-interactive-harness. Do not edit; run: npx harness sync
# Project-specific settings belong in .harness/config.sh
# Regenerated by harness sync, so put your own jobs (deploy, previews, and so
# on) in a separate workflow file rather than editing this one.
#
# Every action is pinned to a commit SHA, with its version in a comment. Tags
# can be moved; SHAs cannot. The harness updates these pins in new releases.

name: harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Expressions never go straight into run: lines (that is how workflow shell
  # injection happens). They are mapped to env here and read as variables.
  BASE_REF: ${{ github.base_ref }}
  EVENT: ${{ github.event_name }}

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # the new-code checks need the merge base
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Boundaries
        env:
          CI_TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: npx harness boundaries
      - name: Stack checks
        run: npx harness stack
      - name: Ratchet (enforced here, soft in the hooks)
        run: npx harness ratchet --check
      - name: New code introduced by this branch
        if: github.event_name == 'pull_request'
        run: npx harness ratchet --new "origin/${BASE_REF}"
      - name: Migrations (order, and no edits to merged ones)
        if: github.event_name == 'pull_request' && hashFiles('supabase/migrations/*.sql') != ''
        run: npx harness migrations --strict "origin/${BASE_REF}"
      # `harness run` passes when a script is missing but leaves a warning on
      # the run, so a step that checked nothing never looks like one that did.
      - name: Types
        run: npx harness run typecheck
      - name: Lint
        run: npx harness run lint
      - name: Unit tests
        run: npx harness run test:unit

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # secret scanning needs history; semgrep needs the merge base
          persist-credentials: false

      # The gitleaks CLI is MIT licensed and needs no license key. (The
      # gitleaks-action wrapper requires a paid key on organization repos.)
      # The download is verified against its published checksum.
      # Accepted historical findings go in .gitleaksignore, one fingerprint per line.
      - name: Secrets in history
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Static analysis (new findings only on pull requests)
        run: |
          pipx install semgrep==1.178.0
          if [ "$EVENT" = "pull_request" ]; then
            npx harness semgrep --pr "origin/${BASE_REF}"
          else
            npx harness semgrep --push
          fi

      - name: Dependency vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc  # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # In a monorepo, the root build script should build every app (for
      # example "build": "turbo run build").
      - name: Build
        run: npx harness run build
      - name: Bundle budget
        run: npx harness run size

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Browsers (only if the project has e2e tests)
        if: hashFiles('**/playwright.config.*') != ''
        run: npx playwright install --with-deps chromium
      - name: End to end tests
        run: npx harness run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Audits the database that actually backs the app. RLS and grants are the
  # real perimeter in a Supabase app, so this is the most important job here.
  #
  # SUPABASE_DB_URL (repository secret) must be the SESSION POOLER URI from
  # Supabase: Project Settings > Database > Connection string > Session pooler.
  #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
  # The direct host (db.<ref>.supabase.co) is IPv6-only, and GitHub runners are
  # IPv4, so it cannot connect from here.
  #
  # Every query is a catalogue read, so pointing it at production is safe.
  # Without the secret this job FAILS rather than passing while auditing
  # nothing. To opt out deliberately, set HARNESS_REQUIRE_DB_AUDIT=0 in
  # .harness/config.sh.
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Grants and row level security audit
        run: npx harness rls
      - name: Migrations applied to this database
        run: npx harness migrations --remote "origin/${BASE_REF:-main}"
      - name: Supabase linter
        if: env.SUPABASE_DB_URL != ''
        continue-on-error: true
        run: npx --yes supabase@2.117.0 db lint --db-url "$SUPABASE_DB_URL" --level warning
